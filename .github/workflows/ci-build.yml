# This file was generated by Project Keeper.
name: CI Build
on:
  push:
    branches: [
      main
    ]
    
  pull_request:
    types: [
      opened,
      synchronize,
      reopened,
      ready_for_review
    ]
    
  workflow_dispatch: null
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run: {
        shell: bash
      }
    permissions: {
      contents: read,
      issues: read
    }
    concurrency: {
      group: '${{ github.workflow }}-build-and-test-${{ github.ref }}',
      cancel-in-progress: true
    }
    outputs: {
      release-required: '${{ steps.check-release.outputs.release-required }}'
    }
    steps:
      - name: Free Disk Space
        id: free-disk-space
        if: ${{ false }}
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
      - name: Checkout the repository
        id: checkout
        uses: actions/checkout@v4
        with: {
          fetch-depth: 0
        }
      - name: Set up JDKs
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |-
            11
            17
          cache: maven
      - id: setup-node
        uses: actions/setup-node@v4
        with: {
          node-version: '22',
          cache: npm,
          cache-dependency-path: javascript-test/package-lock.json
        }
      - name: Run JavaScript tests
        id: run-javascript-tests
        run: |
          cd javascript-test
          npm ci
          npm run test
      - {
        name: Build connectors,
        id: build-connectors,
        run: ./tools/package_connector.sh
      }
      - name: Filter artifacts to be signed
        id: esign-filter
        run: |
          ver_jdbc=$(grep "plugin-version" < src/exasol_jdbc/manifest.xml | sed 's/^.*plugin-version="\([^"]*\)".*$/\1/')
          ver_odbc=$(grep "plugin-version" < src/exasol_jdbc/manifest.xml | sed 's/^.*plugin-version="\([^"]*\)".*$/\1/')
          jar_jdbc=target/tableau-exasol-connector_jdbc_${ver_jdbc}.jar
          tgt_jdbc=target/tableau-exasol-connector_jdbc_${ver_jdbc}.taco
          jar_odbc=target/tableau-exasol-connector_odbc_${ver_odbc}.jar
          tgt_odbc=target/tableau-exasol-connector_odbc_${ver_odbc}.taco
          cp target/exasol_jdbc.taco ${jar_jdbc}
          cp target/exasol_odbc.taco ${jar_odbc}
          echo "jar_jdbc=${jar_jdbc}" >> "$GITHUB_OUTPUT"
          echo "jar_odbc=${jar_odbc}" >> "$GITHUB_OUTPUT"
          echo "tgt_jdbc=${tgt_jdbc}" >> "$GITHUB_OUTPUT"
          echo "tgt_odbc=${tgt_odbc}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Sign JDBC with CodeSignTool
        id: esign-jdbc
        uses: sslcom/esigner-codesign@v1.3.1
        with: {
          command: sign,
          username: '${{ secrets.ESIGN_USERNAME }}',
          password: '${{ secrets.ESIGN_PASSWORD }}',
          credential_id: '${{ secrets.ESIGN_CREDENTIAL_ID }}',
          totp_secret: '${{ secrets.ESIGN_TOTP_SECRET }}',
          file_path: '${{ steps.esign-filter.outputs.jar_jdbc }}',
          override: true
        }
      - name: Copy signed files
        id: esign-copy-target
        run: |
          cp ${{ steps.esign-filter.outputs.jar_jdbc }} ${{ steps.esign-filter.outputs.tgt_jdbc }}
          cp ${{ steps.esign-filter.outputs.jar_odbc }} ${{ steps.esign-filter.outputs.tgt_odbc }}
          echo "All done"
          ls -l target
      - name: Sign ODBC with CodeSignTool
        id: esign-odbc
        uses: sslcom/esigner-codesign@v1.3.1
        with: {
          command: sign,
          username: '${{ secrets.ESIGN_USERNAME }}',
          password: '${{ secrets.ESIGN_PASSWORD }}',
          credential_id: '${{ secrets.ESIGN_CREDENTIAL_ID }}',
          totp_secret: '${{ secrets.ESIGN_TOTP_SECRET }}',
          file_path: '${{ steps.esign-filter.outputs.jar_odbc }}',
          override: true
        }
      - name: Cache SonarCloud packages
        id: cache-sonar
        uses: actions/cache@v4
        with: {
          path: ~/.sonar/cache,
          key: '${{ runner.os }}-sonar',
          restore-keys: '${{ runner.os }}-sonar'
        }
      - {
        name: Enable testcontainer reuse,
        id: enable-testcontainer-reuse,
        run: echo 'testcontainers.reuse.enable=true' > "$HOME/.testcontainers.properties"
      }
      - {
        name: Project Keeper Verify,
        id: build-pk-verify,
        run: 'mvn --batch-mode --projects . test com.exasol:project-keeper-maven-plugin:verify'
      }
      - {
        name: Generate dummy error code report,
        id: generate-dummy-error-code-report,
        run: 'echo ''{"$schema":"https://schemas.exasol.com/error_code_report-1.0.0.json","errorCodes":[]}'' > target/error_code_report.json'
      }
      - name: Sonar analysis
        id: sonar-analysis
        if: ${{ env.SONAR_TOKEN != null }}
        run: |
          mvn --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
              -DtrimStackTrace=false \
              -Dsonar.token=$SONAR_TOKEN
        env: {
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}',
          SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}'
        }
      - name: Audit NPM dependencies
        id: audit-npm-dependencies
        run: |
          cd javascript-test
          npm audit --audit-level low
          npm audit signatures
      - name: Verify Release Artifacts
        id: verify-release-artifacts
        run: "print_message() {\n    local -r message=$1\n    echo \"$message\"\n    echo \"$message\" >> \"$GITHUB_STEP_SUMMARY\"\n}\n\nprint_message \"### Release Artifacts\"\n\nIFS=$'\\n' artifacts_array=($ARTIFACTS)\nmissing_files=()\nfor file in \"${artifacts_array[@]}\";\ndo  \n    echo \"Checking if file $file exists...\"\n    if ! [[ -f \"$file\" ]]; then\n        print_message \"* ⚠️ \\`$file\\` does not exist ⚠️\"\n        echo \"Content of directory $(dirname \"$file\"):\"\n        ls \"$(dirname \"$file\")\"\n        missing_files+=(\"$file\")\n    else\n        print_message \"* \\`$file\\` ✅\" \n    fi\ndone\nprint_message \"\"\nnumber_of_missing_files=${#missing_files[@]}\nif [[ $number_of_missing_files -gt 0 ]]; then\n    print_message \"⚠️ $number_of_missing_files release artifact(s) missing ⚠️\"\n    exit 1\nfi\n"
        env: {
          ARTIFACTS: '${{ steps.build-pk-verify.outputs.release-artifacts }}'
        }
      - name: Upload artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with: {
          name: artifacts,
          path: '${{ steps.build-pk-verify.outputs.release-artifacts }}',
          retention-days: 5
        }
      - name: Configure link check
        id: configure-link-check
        run: |
          mkdir -p ./target
          echo '{"aliveStatusCodes": [429, 200], "ignorePatterns": [' \
               '{"pattern": "^https?://(www|dev).mysql.com/"},' \
               '{"pattern": "^https?://(www.)?opensource.org"}' \
               '{"pattern": "^https?://(www.)?eclipse.org"}' \
               '{"pattern": "^https?://projects.eclipse.org"}' \
               ']}' > ./target/broken_links_checker.json
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        id: run-link-check
        with: {
          use-quiet-mode: yes,
          use-verbose-mode: yes,
          config-file: ./target/broken_links_checker.json
        }
  next-java-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run: {
        shell: bash
      }
    permissions: {
      contents: read
    }
    concurrency: {
      group: '${{ github.workflow }}-next-java-${{ github.ref }}',
      cancel-in-progress: true
    }
    steps:
      - name: Checkout the repository
        id: checkout
        uses: actions/checkout@v4
        with: {
          fetch-depth: 0
        }
      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with: {
          distribution: temurin,
          java-version: '17',
          cache: maven
        }
      - {
        name: Run tests and build with Maven 17,
        id: build-next-java,
        run: mvn --batch-mode clean test -Djava.version=17
      }
  build:
    needs: [
      build-and-test,
      next-java-compatibility
    ]
    runs-on: ubuntu-latest
    defaults:
      run: {
        shell: bash
      }
    permissions: {
      contents: read,
      issues: read
    }
    outputs: {
      release-required: '${{ steps.check-release.outputs.release-required }}'
    }
    steps:
      - name: Checkout the repository
        id: checkout
        uses: actions/checkout@v4
        with: {
          fetch-depth: 0
        }
      - name: Set up JDKs
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |-
            11
            17
          cache: maven
      - name: Check if release is needed
        id: check-release
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if mvn --batch-mode com.exasol:project-keeper-maven-plugin:verify-release --projects .; then
              echo "### ✅ Release preconditions met, start release" >> "$GITHUB_STEP_SUMMARY"
              echo "release-required=true" >> "$GITHUB_OUTPUT"
          else
              echo "### 🛑 Not all release preconditions met, skipping release" >> "$GITHUB_STEP_SUMMARY"
              echo "See log output for details." >> "$GITHUB_STEP_SUMMARY"
              echo "release-required=false" >> "$GITHUB_OUTPUT"
          fi
        env: {
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        }
  start_release:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && needs.build.outputs.release-required == 'true' }}
    concurrency: {
      cancel-in-progress: false,
      group: release
    }
    secrets: inherit
    permissions: {
      contents: write,
      actions: read,
      issues: read
    }
    uses: ./.github/workflows/release.yml
    with: {
      started-from-ci: true,
      maven-central-auto-publish: true
    }
