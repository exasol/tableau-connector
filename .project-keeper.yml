sources:
  - type: maven
    path: jdbc-kerberos-setup-test/pom.xml
    parentPom:
      groupId: "com.exasol"
      artifactId: "tableau-connector"
      version: "${revision}"
      relativePath: "../pom.xml"
    advertise: false
  - type: maven
    path: tableau-server-GUI-tests/pom.xml
    parentPom:
      groupId: "com.exasol"
      artifactId: "tableau-connector"
      version: "${revision}"
      relativePath: "../pom.xml"
  - type: maven
    path: pom.xml
    artifacts:
      - target/exasol_jdbc.taco
      - target/exasol_odbc.taco
      - target/tableau-exasol-connector-jdbc-${version}.taco
      - target/tableau-exasol-connector-odbc-${version}.taco
  - type: npm
    path: javascript-test/package.json
version:
  fromSource: pom.xml
excludes:
  - regex: "(?s)E-PK-CORE-62: The project's README\\.md does not contain a valid badges block\\. Please add or replace the following badges.*"
  - "E-PK-CORE-17: Missing required file: '.github/workflows/ci-build-next-java.yml'"
build:
  runnerOs: ubuntu-24.04
  workflows:
    - name: "ci-build.yml"
      stepCustomizations:
        - action: INSERT_AFTER
          job: build-and-test
          stepId: setup-java
          content:
            id: setup-node
            uses: actions/setup-node@v6
            with:
              node-version: "24"
              cache: "npm"
              cache-dependency-path: "javascript-test/package-lock.json"

        - action: INSERT_AFTER
          job: build-and-test
          stepId: setup-node
          content:
            name: Run JavaScript tests
            id: run-javascript-tests
            run: |
              cd javascript-test
              npm ci
              npm run test

        - action: INSERT_AFTER
          job: build-and-test
          stepId: run-javascript-tests
          content:
            name: Build connectors
            id: build-connectors
            run: ./tools/package_connector.sh

        - action: INSERT_AFTER
          job: build-and-test
          stepId: build-connectors
          content:
            name: Filter artifacts to be signed
            id: esign-filter
            run: |
              ver_jdbc=$(grep "plugin-version" < src/exasol_jdbc/manifest.xml | sed 's/^.*plugin-version="\([^"]*\)".*$/\1/')
              ver_odbc=$(grep "plugin-version" < src/exasol_jdbc/manifest.xml | sed 's/^.*plugin-version="\([^"]*\)".*$/\1/')
              jar_jdbc=target/tableau-exasol-connector-jdbc-${ver_jdbc}.jar
              tgt_jdbc=target/tableau-exasol-connector-jdbc-${ver_jdbc}.taco
              jar_odbc=target/tableau-exasol-connector-odbc-${ver_odbc}.jar
              tgt_odbc=target/tableau-exasol-connector-odbc-${ver_odbc}.taco
              cp target/exasol_jdbc.taco ${jar_jdbc}
              cp target/exasol_odbc.taco ${jar_odbc}
              echo "jar_jdbc=${jar_jdbc}" >> "$GITHUB_OUTPUT"
              echo "jar_odbc=${jar_odbc}" >> "$GITHUB_OUTPUT"
              echo "tgt_jdbc=${tgt_jdbc}" >> "$GITHUB_OUTPUT"
              echo "tgt_odbc=${tgt_odbc}" >> "$GITHUB_OUTPUT"
              cat "$GITHUB_OUTPUT"
        - action: INSERT_AFTER
          job: build-and-test
          stepId: esign-filter
          content:
            name: Sign JDBC with CodeSignTool
            id: esign-jdbc
            uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
            with:
              command: sign
              username: ${{ secrets.ESIGN_USERNAME }}
              password: ${{ secrets.ESIGN_PASSWORD }}
              credential_id: ${{ secrets.ESIGN_CREDENTIAL_ID }}
              totp_secret: ${{ secrets.ESIGN_TOTP_SECRET }}
              file_path: ${{ steps.esign-filter.outputs.jar_jdbc }}
              override: true
        - action: INSERT_AFTER
          job: build-and-test
          stepId: esign-jdbc
          content:
            name: Sign ODBC with CodeSignTool
            id: esign-odbc
            uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
            with:
              command: sign
              username: ${{ secrets.ESIGN_USERNAME }}
              password: ${{ secrets.ESIGN_PASSWORD }}
              credential_id: ${{ secrets.ESIGN_CREDENTIAL_ID }}
              totp_secret: ${{ secrets.ESIGN_TOTP_SECRET }}
              file_path: ${{ steps.esign-filter.outputs.jar_odbc }}
              override: true
        - action: INSERT_AFTER
          job: build-and-test
          stepId: esign-odbc
          content:
            name: Copy signed files
            id: esign-copy-target
            run: |
              cp ${{ steps.esign-filter.outputs.jar_jdbc }} ${{ steps.esign-filter.outputs.tgt_jdbc }}
              cp ${{ steps.esign-filter.outputs.jar_odbc }} ${{ steps.esign-filter.outputs.tgt_odbc }}
              echo "All done"
              ls -l target
        - action: INSERT_AFTER
          job: build-and-test
          stepId: esign-copy-target
          content:
            name: Switch to java 17
            id: esign-switch-java
            uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: 17
              cache: maven

        - action: REPLACE
          job: build-and-test
          stepId: build-pk-verify
          content:
            name: Project Keeper Verify
            id: build-pk-verify
            run: mvn --batch-mode --projects . test com.exasol:project-keeper-maven-plugin:verify -DossindexSkip=true

        - action: INSERT_AFTER
          job: build-and-test
          stepId: build-pk-verify
          content:
            name: Generate dummy error code report
            id: generate-dummy-error-code-report
            run: echo '{"$schema":"https://schemas.exasol.com/error_code_report-1.0.0.json","errorCodes":[]}' > target/error_code_report.json

        - action: INSERT_AFTER
          job: build-and-test
          stepId: sonar-analysis
          content:
            name: Audit NPM dependencies
            id: audit-npm-dependencies
            run: |
              cd javascript-test
              npm audit --audit-level low
              npm audit signatures

        - action: REPLACE
          job: next-java-compatibility
          stepId: build-next-java
          content:
            name: Run tests and build with Maven 17
            id: build-next-java
            run: mvn --batch-mode clean test -Djava.version=17

    - name: "release.yml"
      stepCustomizations:
        - action: INSERT_AFTER
          job: release
          stepId: setup-jdks
          content:
            id: setup-node
            uses: actions/setup-node@v6
            with:
              node-version: "24"
              cache: "npm"
              cache-dependency-path: "javascript-test/package-lock.json"

        - action: REPLACE
          job: release
          stepId: build
          content:
            name: Build connectors
            id: build
            run: ./tools/package_connector.sh

        - action: INSERT_AFTER
          job: release
          stepId: build
          content:
            name: Filter artifacts to be signed
            id: esign-filter
            run: |
              ver_jdbc=$(grep "plugin-version" < src/exasol_jdbc/manifest.xml | sed 's/^.*plugin-version="\([^"]*\)".*$/\1/')
              ver_odbc=$(grep "plugin-version" < src/exasol_jdbc/manifest.xml | sed 's/^.*plugin-version="\([^"]*\)".*$/\1/')
              jar_jdbc=target/tableau-exasol-connector-jdbc-${ver_jdbc}.jar
              tgt_jdbc=target/tableau-exasol-connector-jdbc-${ver_jdbc}.taco
              jar_odbc=target/tableau-exasol-connector-odbc-${ver_odbc}.jar
              tgt_odbc=target/tableau-exasol-connector-odbc-${ver_odbc}.taco
              cp target/exasol_jdbc.taco ${jar_jdbc}
              cp target/exasol_odbc.taco ${jar_odbc}
              echo "jar_jdbc=${jar_jdbc}" >> "$GITHUB_OUTPUT"
              echo "jar_odbc=${jar_odbc}" >> "$GITHUB_OUTPUT"
              echo "tgt_jdbc=${tgt_jdbc}" >> "$GITHUB_OUTPUT"
              echo "tgt_odbc=${tgt_odbc}" >> "$GITHUB_OUTPUT"
              cat "$GITHUB_OUTPUT"
        - action: INSERT_AFTER
          job: release
          stepId: esign-filter
          content:
            name: Sign JDBC with CodeSignTool
            id: esign-jdbc
            uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
            with:
              command: sign
              username: ${{ secrets.ESIGN_USERNAME }}
              password: ${{ secrets.ESIGN_PASSWORD }}
              credential_id: ${{ secrets.ESIGN_CREDENTIAL_ID }}
              totp_secret: ${{ secrets.ESIGN_TOTP_SECRET }}
              file_path: ${{ steps.esign-filter.outputs.jar_jdbc }}
              override: true
        - action: INSERT_AFTER
          job: release
          stepId: esign-jdbc
          content:
            name: Sign ODBC with CodeSignTool
            id: esign-odbc
            uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
            with:
              command: sign
              username: ${{ secrets.ESIGN_USERNAME }}
              password: ${{ secrets.ESIGN_PASSWORD }}
              credential_id: ${{ secrets.ESIGN_CREDENTIAL_ID }}
              totp_secret: ${{ secrets.ESIGN_TOTP_SECRET }}
              file_path: ${{ steps.esign-filter.outputs.jar_odbc }}
              override: true
        - action: INSERT_AFTER
          job: release
          stepId: esign-odbc
          content:
            name: Copy signed files
            id: esign-copy-target
            run: |
              cp ${{ steps.esign-filter.outputs.jar_jdbc }} ${{ steps.esign-filter.outputs.tgt_jdbc }}
              cp ${{ steps.esign-filter.outputs.jar_odbc }} ${{ steps.esign-filter.outputs.tgt_odbc }}
              echo "All done"
              ls -l target
        - action: INSERT_AFTER
          job: release
          stepId: esign-copy-target
          content:
            name: Switch to java 17
            id: esign-switch-java
            uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: 17
              cache: maven

        - action: INSERT_AFTER
          job: release
          stepId: build
          content:
            name: Generate dummy error code report
            id: generate-dummy-error-code-report
            run: echo '{"$schema":"https://schemas.exasol.com/error_code_report-1.0.0.json","errorCodes":[]}' > target/error_code_report.json
